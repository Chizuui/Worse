[package]
name = "harness-app"
version = "0.1.0"
description = "Harness desktop and mobile composition root"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "harness_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
harness-core = { path = "../../../crates/harness-core" }
harness-platform = { path = "../../../crates/harness-platform" }
harness-protocol = { path = "../../../crates/harness-protocol" }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
log.workspace = true
# 修复原因：shell 未安装 tracing subscriber，tracing 事件此前全部丢失；开启 log 特性后转发给 tauri-plugin-log（stdout + release 日志文件）。
tracing = { workspace = true, features = ["log"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Phase 5 (plugins): hsandbox response bodies arrive base64-encoded from host-node.
base64.workspace = true
harness-host-control = { path = "../../../crates/harness-host-control" }
harness-host-protocol = { path = "../../../crates/harness-host-protocol" }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
# Phase 6 (updater B): auto-updater, spec phase-6-updater.md.
serde.workspace = true
tauri-plugin-updater.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
# Phase 6 fix round: the updater temp sweep compares a leftover's version with the running one.
semver.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true