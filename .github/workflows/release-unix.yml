name: release-unix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (e.g. v0.1.2)"
        required: true
      platforms:
        description: "linux, macos or all"
        required: false
        default: all

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms != 'macos' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libgtk-3-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxrandr-dev \
            libxi-dev libxtst-dev libxdo-dev libdbus-1-dev libpipewire-0.3-dev libegl-dev \
            libgbm-dev libgl1-mesa-dev libssl-dev

      - name: Toolchain
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p harness-slint --release --bins

      - name: Package
        run: |
          set -euo pipefail
          dir=dist/Worse-Harness-linux-x64
          mkdir -p "$dir"
          cp target/release/harness-slint "$dir/worse-harness"
          chmod +x "$dir/worse-harness"
          cp LICENSE NOTICE "$dir/" 2>/dev/null || true
          tar -C dist -czf dist/Worse-Harness-linux-x64.tar.gz Worse-Harness-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Worse-Harness-linux-x64
          path: dist/Worse-Harness-linux-x64.tar.gz

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Worse-Harness-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms != 'linux' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build -p harness-slint --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build -p harness-slint --release --target x86_64-apple-darwin

      - name: Bundle
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app=dist/Harness.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/harness-slint \
            target/x86_64-apple-darwin/release/harness-slint \
            -output "$app/Contents/MacOS/harness-slint"
          chmod +x "$app/Contents/MacOS/harness-slint"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Worse Harness</string>
            <key>CFBundleDisplayName</key><string>Worse Harness</string>
            <key>CFBundleIdentifier</key><string>dev.harness.slint</string>
            <key>CFBundleExecutable</key><string>harness-slint</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          cd dist && ditto -c -k --keepParent Harness.app Worse-Harness-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Worse-Harness-macos-universal
          path: dist/Worse-Harness-macos-universal.zip

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Worse-Harness-macos-universal.zip --clobber --repo "$GITHUB_REPOSITORY"
