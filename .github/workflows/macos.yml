name: macos-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build -p harness-slint --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build -p harness-slint --release --target x86_64-apple-darwin

      - name: Bundle
        run: |
          set -euo pipefail
          app=dist/Harness.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/harness-slint \
            target/x86_64-apple-darwin/release/harness-slint \
            -output "$app/Contents/MacOS/harness-slint"
          chmod +x "$app/Contents/MacOS/harness-slint"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Worse Harness</string>
            <key>CFBundleDisplayName</key><string>Worse Harness</string>
            <key>CFBundleIdentifier</key><string>dev.harness.slint</string>
            <key>CFBundleExecutable</key><string>harness-slint</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          cd dist && ditto -c -k --keepParent Harness.app Worse-Harness-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Harness-macos-universal
          path: dist/Worse-Harness-macos-universal.zip

      # Tag builds attach the app to the GitHub release of that tag (created if missing).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Worse-Harness-macos-universal.zip
