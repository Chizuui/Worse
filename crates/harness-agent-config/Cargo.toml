[package]
name = "harness-agent-config"
version = "0.1.0"
description = "Reads and writes agent CLI configuration (MCP servers, skills, commands, hooks, subagents, instructions) for Claude Code, Codex and agy, plus the Harness MCP overlay; diff preview, atomic writes, never reads credentials (spec phase-9-parity.md §9.1.3-9.1.4)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harness-settings = { path = "../harness-settings" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", default-features = false, features = ["fs", "sync", "io-util"] }
toml_edit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", default-features = false, features = ["fs", "sync", "io-util", "macros", "rt"] }

[lints]
workspace = true
