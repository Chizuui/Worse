[package]
name = "harness-fs"
version = "0.1.0"
description = "Workspace file-system primitives for the Harness Rust Host: stat, bounded reads, atomic writes, path identity and symlink policy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
icu_collator = { workspace = true }
magika = { version = "1.1.0", optional = true }

[features]
default = []
magika = ["dep:magika"]
ort = ["dep:ort"]

[dependencies.ort]
version = "=2.0.0-rc.12"
optional = true

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
