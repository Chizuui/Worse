[package]
name = "harness-remote"
version = "0.1.0"
description = "Remote phone access for Harness: loopback HTTP + WebSocket bridge to HarnessCore with device pairing (spec phase-12-remote-phone.md)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harness-core-api = { path = "../harness-core-api" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "io-util", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
base64 = { workspace = true }
getrandom = "0.3"
subtle = "2"

[lints]
workspace = true
