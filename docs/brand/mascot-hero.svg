<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="The Worse Harness bunny, unimpressed by a carrot on a stick">
  <!-- Worse Harness mascot: a deadpan bunny in a hi-vis H-harness, side-eyeing a carrot on a stick. Original artwork for this project. -->
  <g stroke="#15171c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- carrot on a stick: rod from the harness, behind the bunny -->
    <path d="M318 418 C392 330 424 170 492 78" fill="none" stroke="#15171c" stroke-width="24"/>
    <path d="M318 418 C392 330 424 170 492 78" fill="none" stroke="#e9d4ab" stroke-width="9"/>
    <path d="M492 78 V176" fill="none" stroke="#8d929b" stroke-width="4"/>
    <!-- torso -->
    <path d="M250 296 C312 296 362 362 366 432 C369 482 330 508 250 508 C170 508 131 482 134 432 C138 362 188 296 250 296 Z" fill="#f6f1e7"/>
    <!-- harness: chest band + centre strap (an H-harness seen from the front) -->
    <path d="M139 404 C196 426 304 426 361 404 L365 436 C306 458 194 458 135 436 Z" fill="#c8f04a"/>
    <path d="M238 318 H262 V424 H238 Z" fill="#c8f04a"/>
    <circle cx="250" cy="430" r="15" fill="#f6f1e7" stroke-width="9"/>
    <!-- feet -->
    <ellipse cx="184" cy="502" rx="50" ry="24" fill="#f6f1e7"/>
    <ellipse cx="316" cy="502" rx="50" ry="24" fill="#f6f1e7"/>
    <!-- paws -->
    <ellipse cx="204" cy="470" rx="20" ry="26" fill="#f6f1e7"/>
    <ellipse cx="296" cy="470" rx="20" ry="26" fill="#f6f1e7"/>
    <!-- collar -->
    <path d="M186 292 C186 332 216 346 250 346 C284 346 314 332 314 292 Z" fill="#c8f04a"/>
  </g>
  <g transform="translate(91 24) scale(0.62)" stroke="#15171c" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- left ear -->
    <path d="M146 262 C124 198 122 112 148 72 C163 48 193 48 208 72 C232 112 234 198 228 262 Z" fill="#f6f1e7"/>
    <path d="M170 246 C158 198 158 132 170 102 C175 90 181 90 186 102 C198 132 204 198 202 246 Z" fill="#ffb596" stroke="none"/>
    <!-- right ear: upright stub + folded flap -->
    <path d="M284 262 C278 212 280 168 292 136 L372 136 C376 178 374 220 366 262 Z" fill="#f6f1e7"/>
    <path d="M308 246 C304 210 306 180 312 160 L348 160 C350 188 348 218 342 246 Z" fill="#ffb596" stroke="none"/>
    <path d="M290 138 C300 96 344 76 392 92 C436 107 462 150 452 196 C446 222 414 226 402 204 C394 180 386 156 372 138 Z" fill="#f6f1e7"/>
    <!-- head -->
    <path d="M256 206 C348 206 406 250 414 320 C422 394 366 458 256 458 C146 458 90 394 98 320 C106 250 164 206 256 206 Z" fill="#f6f1e7"/>
    <!-- deadpan eyes -->
    <path d="M186 322 A22 25 0 0 0 230 322 Z" fill="#15171c" stroke="none"/>
    <path d="M304 322 A22 25 0 0 0 348 322 Z" fill="#15171c" stroke="none"/>
    <path d="M162 320 H232 M280 320 H350" fill="none" stroke-width="15"/>
    <!-- nose + mouth -->
    <path d="M238 362 H274 L256 383 Z" fill="#ff9a5c" stroke-width="8"/>
    <path d="M256 386 V397 M256 397 C246 409 232 407 226 397 M256 397 C266 409 280 407 286 397" fill="none" stroke-width="10"/>

  </g>
  <!-- carrot -->
  <g stroke="#15171c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M492 190 C478 170 462 168 458 150 C478 150 486 160 492 176 C494 156 500 144 514 138 C518 156 510 168 500 180 C512 168 526 166 538 172 C530 186 512 190 492 190 Z" fill="#c8f04a"/>
    <path d="M462 196 C462 182 524 182 524 196 C524 236 508 286 493 300 C478 286 462 236 462 196 Z" fill="#ff8a3d"/>
    <path d="M476 214 H492 M496 240 H510 M482 262 H494" fill="none" stroke-width="6" stroke="#c2571a"/>
  </g>
</svg>
